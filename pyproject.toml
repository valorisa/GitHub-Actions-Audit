[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gha-audit"
version = "0.1.0"
description = "Audit et mise à jour automatique des versions dans les workflows GitHub Actions"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "ruamel.yaml>=0.18",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gha-audit = "gha_audit.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["gha_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
